<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Eval Progress</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--done:#3d8a5a;--chip:#eeede8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--muted:#a09f98;--line:#34332f;--done:#6fbf8b;--chip:#2a2a27}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:820px;margin:0 auto}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}th{font-size:12px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:120px}.bar div{height:100%;background:var(--done)}
a{color:inherit}
</style></head><body><div class="wrap">
<h1 style="font-size:20px">Human evaluation — progress</h1>
<table><thead><tr><th>annotator</th><th>saved</th><th></th><th>3.2 aesth.</th><th>3.3 align.</th><th>3.1 decomp.</th><th>last save</th></tr></thead><tbody id="rows"></tbody></table>
<p><a id="csv" href="#">Download unblinded CSV</a> · refreshes every 30 s</p></div>
<script>
const K=new URLSearchParams(location.search).get("k")||"";
document.getElementById("csv").href="/export.csv?k="+encodeURIComponent(K);
async function load(){const r=await fetch("/api/progress?k="+encodeURIComponent(K)).then(r=>r.json());
 if(r.error){document.getElementById("rows").innerHTML=`<tr><td colspan=7>${r.error}</td></tr>`;return;}
 document.getElementById("rows").innerHTML=Object.entries(r).map(([a,v])=>`<tr><td>${a}</td><td>${v.done} / ${v.total}</td>
 <td><div class="bar"><div style="width:${100*v.done/v.total}%"></div></div></td><td>${v.by_dim["3.2"]}/${v.per_dim["3.2"]}</td><td>${v.by_dim["3.3"]}/${v.per_dim["3.3"]}</td><td>${v.by_dim["3.1"]}/${v.per_dim["3.1"]}</td><td>${v.last_save||"—"}</td></tr>`).join("");}
load();setInterval(load,30000);
</script></body></html>
