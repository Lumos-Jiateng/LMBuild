<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PP-Bench Human Evaluation</title>
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc;
  --accent:#2f5d8a; --accent-ink:#ffffff; --done:#3d8a5a; --warn:#b4541f; --chip:#eeede8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161615; --panel:#1f1f1d; --ink:#ecebe6; --muted:#a09f98; --line:#34332f;
    --accent:#7fb0de; --accent-ink:#10202e; --done:#6fbf8b; --warn:#e39062; --chip:#2a2a27;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
.pill{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted)}
.bar{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--done);width:0;transition:width .3s}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.imgs{display:flex;flex-direction:column;gap:12px}
.imgs figure{margin:0}
.imgs figcaption{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff;display:block}
.imgs img.sheet{width:auto;max-width:100%;max-height:calc(100vh - 130px);margin:0 auto;object-fit:contain}
.photo{margin:0 0 12px}
.photo figcaption{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.photo img{display:block;max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.side{position:sticky;top:64px;align-self:start}
.dimhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.dimhead h2{font-size:18px;margin:0;text-transform:capitalize}
.q{font-size:16px;font-weight:500;margin:6px 0 10px}
.obj{font-size:14px;margin:0 0 8px}
.obj b{font-size:17px;text-transform:capitalize}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:14px 0;font-size:20px;font-weight:600;border-radius:10px;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.anchors{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.anchors li{margin-bottom:6px;display:flex;gap:8px}
.anchors b{color:var(--ink);min-width:14px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:14px;align-items:center}
.msg{font-size:13px;color:var(--warn);min-height:1em;text-align:center}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.dots span{width:13px;height:13px;border-radius:3px;background:var(--chip);cursor:pointer}
.dots span.done{background:var(--done)}
.dots span.cur{outline:2px solid var(--accent);outline-offset:1px}
.dots .sep{flex-basis:100%;height:4px;background:none;cursor:default}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;background:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:15;padding:16px}
#modal .card{max-width:680px;max-height:90vh;overflow:auto}
#modal h2{margin-top:0}
#modal li{margin-bottom:4px}
.center{max-width:720px;margin:60px auto;padding:0 16px}
kbd{background:var(--chip);border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>PP-Bench · human evaluation</h1>
  <span class="pill" id="who">…</span>
  <span class="pill" id="count">0 / 0</span>
  <div class="bar"><div id="barfill"></div></div>
  <button id="helpbtn">Instructions</button>
</header>
<div id="app"><div class="center">Loading…</div></div>
<div id="lightbox"><img alt=""></div>
<div id="modal"><div class="card" id="modalbody"></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let S = null, idx = 0, t0 = Date.now(), busy = false;

const SHEET = `Each design is shown in one picture: the top row is the assembled object from two sides, the bottom
  row the parts pulled apart (or two more views when there are too many parts). <b>Every part has its own colour</b>
  — the colours only mark parts, they are not the design's real colours.`;
const INTRO = {
  "3.2": {title: "Part 1 of 3 — Aesthetics",
    body: `<p>Each item tells you <b>what object was being built</b> (e.g. “dining table”). Rate whether the design is an
      <b>elegant, well-designed object of that kind that agrees with human aesthetic sense</b>. There is no reference
      picture: you are not asked whether it matches a particular product, only whether it is a well-designed one.</p>
      <p>${SHEET} Ignore the colours and the rendering; judge the form.</p>`},
  "3.3": {title: "Part 2 of 3 — Structure alignment",
    body: `<p>Beside the design you now see a <b>photograph of the target object</b>. Rate how faithfully the design
      reproduces its <b>structure</b>: the parts, where they are, their relative sizes, and fine details such as how many
      legs, wheels or shelves there are. Not beauty, not colour.</p><p>${SHEET}</p>`},
  "3.1": {title: "Part 3 of 3 — Decomposition",
    body: `<p>Rate whether the object is <b>broken into parts the way the real product is made and assembled</b>.
      One colour = one part. The photograph is only there so you know what the object is.</p>
      <ul><li>Each real component should be <b>one</b> part — a door, a tabletop, a wheel rim, a drawer front is one piece,
      not a stack of slabs, bricks or strips.</li>
      <li>Components that move or are made separately should be <b>separate</b> parts — a wheel apart from its axle and the
      body, a door or drawer apart from its frame.</li></ul>`},
};
const GENERAL = `<p><b>One click per item:</b> choose 1–5 and the next item opens. You can also press the keys
  <kbd>1</kbd>–<kbd>5</kbd>. Designs differ a lot, from excellent to unusable — please use the whole scale.
  Nothing tells you which system made a design.</p>
  <p>Every answer is saved on the server at once; you can close the page and continue later with the same link, and
  go back (<kbd>←</kbd>, or the squares) to change an answer. Click a picture to enlarge it.</p>`;

function api(path, opts){ return fetch(path + (path.includes("?")?"&":"?") + "t=" + encodeURIComponent(TOKEN), opts).then(r=>r.json()); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function showModal(html, btn){
  const m = document.getElementById("modal");
  document.getElementById("modalbody").innerHTML = html + `<div class="nav"><span></span><button class="primary" id="mclose">${btn||"Start"}</button></div>`;
  m.style.display = "flex";
  document.getElementById("mclose").onclick = () => { m.style.display = "none"; };
}
function modalOpen(){ return document.getElementById("modal").style.display === "flex"; }
function introFor(dim, force){
  const k = "ppb2_intro_" + TOKEN + dim;
  let seen = false; try { seen = localStorage.getItem(k); } catch(e){}
  if (seen && !force) return;
  showModal(`<h2>${INTRO[dim].title}</h2>${INTRO[dim].body}${GENERAL}`);
  try { localStorage.setItem(k, "1"); } catch(e){}
}

function render(){
  const items = S.items, it = items[idx], dim = it.dim, Q = S.questions[dim];
  const d = S.designs[it.design], task = S.tasks[it.task];
  const prev = S.answers[it.item_id];
  const done = items.filter(x => S.answers[x.item_id]).length;
  document.getElementById("count").textContent = `${done} / ${items.length} done`;
  document.getElementById("barfill").style.width = (100*done/items.length) + "%";

  const photo = Q.photo ? `<figure class="photo"><figcaption>photograph of the target object</figcaption>
      <img src="${task.photo}" alt="photograph"></figure>` : "";
  const imgs = `<figure><figcaption>design — one colour per part</figcaption><img class="sheet" src="img/${it.design}.jpg" alt="design"></figure>`;

  let dots = "", lastDim = null;
  items.forEach((x, i) => {
    if (lastDim && x.dim !== lastDim) dots += `<span class="sep"></span>`;
    lastDim = x.dim;
    dots += `<span data-i="${i}" class="${S.answers[x.item_id]?"done":""} ${i===idx?"cur":""}" title="${S.questions[x.dim].name.replace("_"," ")} · item ${i+1}"></span>`;
  });
  const blockN = items.filter(x => x.dim === dim).length, blockI = items.slice(0, idx+1).filter(x => x.dim === dim).length;

  document.getElementById("app").innerHTML = `<main>
    <div class="card imgs">${imgs}</div>
    <div class="card side">
      <div class="dimhead"><h2>${Q.name.replace("_"," ")}</h2><span class="pill">${blockI} / ${blockN} in this part</span></div>
      <p class="obj">The model was asked to build: <b>${esc(task.name)}</b></p>
      ${photo}
      <p class="q">${esc(Q.question)}</p>
      <p class="hint">${dim === "3.1" ? `This design has <b>${d.n_parts}</b> parts.` : dim === "3.2" ? "Judge it as a design of this kind of object — there is no reference picture." : "Compare the design against the photograph."}</p>
      <div class="scale">${[1,2,3,4,5].map(v => `<button data-v="${v}" class="${prev && prev.score===v?"on":""}">${v}</button>`).join("")}</div>
      <ul class="anchors">${Object.entries(Q.anchors).map(([k,v]) => `<li><b>${k}</b><span>${esc(v)}</span></li>`).join("")}</ul>
      <div class="nav"><button id="prev" ${idx===0?"disabled":""}>← Back</button>
        <span class="msg" id="msg"></span>
        <button id="next" ${idx===items.length-1?"disabled":""}>Skip →</button></div>
      <div class="dots">${dots}</div>
    </div></main>`;

  document.querySelectorAll(".scale button").forEach(b => b.onclick = () => rate(+b.dataset.v));
  document.querySelectorAll(".imgs img, .photo img").forEach(im => im.onclick = () => {
    const lb = document.getElementById("lightbox"); lb.querySelector("img").src = im.src; lb.style.display = "flex";
  });
  document.querySelectorAll(".dots span[data-i]").forEach(s => s.onclick = () => go(+s.dataset.i));
  document.getElementById("prev").onclick = () => go(idx - 1);
  document.getElementById("next").onclick = () => go(idx + 1);
  t0 = Date.now();
  window.scrollTo(0, 0);
  if (idx === 0 || items[idx-1].dim !== dim) introFor(dim, false);
}

async function rate(v){
  if (busy) return;
  busy = true;
  const it = S.items[idx];
  document.querySelectorAll(".scale button").forEach(b => b.classList.toggle("on", +b.dataset.v === v));
  try {
    const r = await api("/api/save", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({item_id: it.item_id, score: v, seconds: Math.round((Date.now()-t0)/1000)})});
    if (!r.ok) throw new Error(r.error || "save failed");
    S.answers[it.item_id] = {score: v};
    const next = S.items.findIndex((x, i) => i > idx && !S.answers[x.item_id]);
    const first = S.items.findIndex(x => !S.answers[x.item_id]);
    if (next >= 0) go(next);
    else if (first >= 0) go(first);
    else { render(); showModal(`<h2>All ${S.items.length} items done — thank you!</h2><p>You can still go back to any item
      with the squares and change your answer.</p>`, "Close"); }
  } catch(e){ document.getElementById("msg").textContent = "Not saved: " + e.message + " — please click again"; }
  busy = false;
}

function go(i){ if (i < 0 || i >= S.items.length) return; idx = i; render(); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ document.getElementById("lightbox").style.display = "none"; document.getElementById("modal").style.display = "none"; return; }
  if (!S || modalOpen()) return;
  if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (/^[1-5]$/.test(e.key)) rate(+e.key);
});
document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").style.display = "none";
document.getElementById("helpbtn").onclick = () => S && introFor(S.items[idx].dim, true);

(async () => {
  const r = await api("/api/session");
  if (r.error){ document.getElementById("app").innerHTML = `<div class="center"><h2>Cannot open the task</h2><p>${esc(r.error)}</p></div>`; return; }
  S = r;
  document.getElementById("who").textContent = "annotator " + r.annotator;
  const first = S.items.findIndex(x => !S.answers[x.item_id]);
  idx = first >= 0 ? first : 0;
  render();
})();
</script>
</body>
</html>
